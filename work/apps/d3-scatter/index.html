<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>D3 Scatter Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #1f2937;
    }
    .wrap {
      max-width: 980px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }
    p {
      margin: 0 0 16px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      background: #f9fafb;
    }
    .axis path,
    .axis line {
      stroke: #9ca3af;
    }
    .grid line {
      stroke: #e5e7eb;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>D3.js Scatter Plot</h1>
      <p>Simple standalone D3 app you can open directly in JupyterLab file browser.</p>
      <svg id="chart" viewBox="0 0 900 500"></svg>
    </div>
  </div>

  <script>
    const data = d3.range(80).map((d) => ({
      x: Math.random() * 100,
      y: Math.random() * 100,
      r: 4 + Math.random() * 8,
      group: d % 4
    }));

    const svg = d3.select("#chart");
    const width = 900;
    const height = 500;
    const margin = { top: 20, right: 24, bottom: 44, left: 56 };

    const x = d3.scaleLinear().domain([0, 100]).range([margin.left, width - margin.right]);
    const y = d3.scaleLinear().domain([0, 100]).range([height - margin.bottom, margin.top]);
    const color = d3.scaleOrdinal().domain([0, 1, 2, 3]).range(["#2563eb", "#ef4444", "#16a34a", "#f59e0b"]);

    const xAxis = d3.axisBottom(x).ticks(10);
    const yAxis = d3.axisLeft(y).ticks(10);

    svg.append("g")
      .attr("class", "grid")
      .attr("transform", `translate(0,${height - margin.bottom})`)
      .call(d3.axisBottom(x).ticks(10).tickSize(-(height - margin.top - margin.bottom)).tickFormat(""));

    svg.append("g")
      .attr("class", "grid")
      .attr("transform", `translate(${margin.left},0)`)
      .call(d3.axisLeft(y).ticks(10).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

    svg.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${height - margin.bottom})`)
      .call(xAxis);

    svg.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(${margin.left},0)`)
      .call(yAxis);

    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height - 8)
      .attr("text-anchor", "middle")
      .text("X value");

    svg.append("text")
      .attr("transform", "rotate(-90)")
      .attr("x", -height / 2)
      .attr("y", 18)
      .attr("text-anchor", "middle")
      .text("Y value");

    svg.append("g")
      .selectAll("circle")
      .data(data)
      .join("circle")
      .attr("cx", (d) => x(d.x))
      .attr("cy", (d) => y(d.y))
      .attr("r", 0)
      .attr("fill", (d) => color(d.group))
      .attr("opacity", 0.85)
      .transition()
      .duration(700)
      .delay((_, i) => i * 8)
      .attr("r", (d) => d.r);
  </script>
</body>
</html>
