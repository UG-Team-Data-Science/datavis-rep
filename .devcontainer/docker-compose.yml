version: '3.8'

services:
  datavis-rep:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/datavis-rep
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=
      - JUPYTER_PASSWORD=
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token='' --ServerApp.password=''
